shop:
  name: ShopTwin
  frontendUrl: http://localhost:3101
  apiUrl: http://localhost:4101
  openapiUrl: http://localhost:4101/api/openapi.json
  healthEndpoint: /api/health
  resetEndpoint: /api/research/reset
  stateEndpoint: /api/research/state
  eventsEndpoint: /api/research/events
  defectsEndpoint: /api/research/defects
  verifierEndpointTemplate: /api/research/verify/{journeyId}
  contractDirectory: replicas/shop-twin/research/contracts
  allowedHosts:
    - localhost:3101
    - localhost:4101
    - 127.0.0.1:3101
    - 127.0.0.1:4101
  credentials:
    adminEmailEnv: PATCHWORK_SHOP_ADMIN_EMAIL
    adminPasswordEnv: PATCHWORK_SHOP_ADMIN_PASSWORD
    userEmailEnv: PATCHWORK_SHOP_USER_EMAIL
    userPasswordEnv: PATCHWORK_SHOP_USER_PASSWORD

